services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://earthpulse:earthpulse@db:5432/earthpulse
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: earthpulse
      POSTGRES_PASSWORD: earthpulse
      POSTGRES_DB: earthpulse
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
